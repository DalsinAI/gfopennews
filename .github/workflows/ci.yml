name: GFOpenNews CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gfopennetkit at a fixed commit (netkit #5: the fake POST)
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopennetkit
          ref: 561f365f2f5305911c6ed5e91e3d7a48691fbfdf
          path: deps/gfopennetkit
      # gfopenlayout (its UI, olui) for the reader window, also at a fixed commit
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopenlayout
          ref: 766e731837459d22709fa2364e6dd4d95bae95c5
          path: deps/gfopenlayout
      - run: cmake -S . -B build -DNETKIT_DIR=$GITHUB_WORKSPACE/deps/gfopennetkit -DGFOPENLAYOUT_DIR=$GITHUB_WORKSPACE/deps/gfopenlayout
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
