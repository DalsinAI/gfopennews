name: GFOpenNews CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gfopennetkit at a fixed commit; moved on in its own PR
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopennetkit
          ref: 2fc096687d3d80f63df605400c503b248ee4c159
          path: deps/gfopennetkit
      - run: cmake -S . -B build -DNETKIT_DIR=$GITHUB_WORKSPACE/deps/gfopennetkit
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
